services:
  tuner:
    build: .
    restart: unless-stopped
    # Host mapping stays loopback-only; 0.0.0.0 below is container-internal.
    ports:
      - "127.0.0.1:${APP_PORT:-43127}:43127"
    environment:
      TUNER_BIND_HOST: "0.0.0.0"
      TUNER_PORT: "43127"
      TUNER_PUBLIC_PORT: "${APP_PORT:-43127}"
      TUNER_DATA_DIR: "/data"
      TUNER_LOG_LEVEL: "${TUNER_LOG_LEVEL:-INFO}"
      TZ: "Europe/Warsaw"
    volumes:
      - tuner-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tuner-data:
